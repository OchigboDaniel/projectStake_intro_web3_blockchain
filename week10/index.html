<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ethereum Balance Checker</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 560px; margin: 3rem auto; padding: 0 1rem; color: #1b1f24; }
    h1 { font-size: 1.4rem; }
    label { display: block; margin: 1.25rem 0 .35rem; font-weight: 600; }
    input { width: 100%; padding: .6rem; font: inherit; font-family: ui-monospace, monospace; font-size: .85rem; box-sizing: border-box; }
    button { margin-top: .75rem; padding: .6rem 1.1rem; font: inherit; cursor: pointer; }
    dl { margin-top: 1.5rem; }
    dt { font-size: .85rem; color: #57606a; margin-top: 1rem; }
    dd { margin: .2rem 0 0; font-size: 1.25rem; font-family: ui-monospace, monospace; word-break: break-all; }
    #status { margin-top: 1rem; font-size: .9rem; }
    .error { color: #b42318; }
  </style>
</head>
<body>
  <h1>Ethereum balance checker</h1>

  <label for="address">Wallet address</label>
  <input id="address" value="0xd8da6bf26964af9d7eed9e03e53415d37aa96045" spellcheck="false">
  <button id="fetchBtn">Fetch data</button>

  <p id="status"></p>

  <dl>
    <dt>Network</dt>
    <dd id="network">-</dd>
    <dt>Current block number</dt>
    <dd id="block">-</dd>
    <dt>ETH balance</dt>
    <dd id="balance">-</dd>
  </dl>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
  <script src="./config.js"></script>
  <script src="./On-ChainReader.js"></script>
</body>
</html>
