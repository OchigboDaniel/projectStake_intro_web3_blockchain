<style>
  .trail {
    position: absolute;
    height: 6px; width: 6px;
    border-radius: 3px;
    background: teal;
  }
  body {
    height: 300px;
  }
</style>

<script>
  const trailCount = 8;
  let trail = [];

  for (let i = 0; i < trailCount; i++) {
    let elt = document.createElement("div");
    elt.className = "trail";
    document.body.appendChild(elt);
    trail.push(elt);
  }

  let currentTrailIndex = 0;

  window.addEventListener("mousemove", event => {
    let dot = trail[currentTrailIndex];
    dot.style.left = (event.pageX - 3) + "px";
    dot.style.top = (event.pageY - 3) + "px";
    currentTrailIndex = (currentTrailIndex + 1) % trail.length;
  });
</script>
